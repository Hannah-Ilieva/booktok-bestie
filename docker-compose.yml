services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run setup.ps1 to create .env}
      POSTGRES_USER: ${POSTGRES_USER:?Run setup.ps1 to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 to create .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - booktok_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booktok_catalog_data:
